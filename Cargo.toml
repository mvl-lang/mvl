[workspace]
members = [".", "runtime/core", "runtime/rust", "runtime/rust-tokio", "runtime/llvm", "runtime/wasm"]
exclude = ["fuzz", "tests/spikes/003-gzip/bench"]

[package]
name = "mvl"
version = "1.8.1"
edition = "2021"
description = "MVL — Maximum Verifiable Language compiler"
license = "Apache-2.0"

[features]
# Z3 backend is on by default. Requires Z3 installed.
# macOS homebrew: brew install z3  (paths set via .cargo/config.toml)
# To build without Z3: cargo build --no-default-features
default = ["z3", "openapi"]
z3 = ["dep:z3"]
# OpenAPI generation — walks AST surface, excluded from self-host build (#1336).
# To build without: cargo build --no-default-features [--features z3]
openapi = []

[dependencies]
ureq = "2"
tempfile = "3"
tar = "0.4"
flate2 = "1"
regex = "1"
z3 = { version = "0.12", optional = true }
# Assemble + type-validate `--backend=wasm` output before reporting success.
# `mvl build --backend=wasm` / `mvl test --backend=wasm` used to exit 0 on a
# module with a dangling `call` to an undefined function (or any other
# assembly failure) — the compiler had already written the broken call, but
# nothing checked it before declaring victory (#2091). Promoted from
# dev-dependencies (where they already validated emitted WAT inside `cargo
# test`, see `src/cli/wasm_text.rs`'s test modules) since the same check now
# also runs in the production CLI path, not just tests.
wat = "1"
wasmparser = "0.221"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "refinement_solver"
harness = false
