[workspace]
members = [".", "runtime/core", "runtime/rust", "runtime/rust-tokio", "runtime/llvm", "runtime/wasm"]
exclude = ["fuzz", "tests/spikes/003-gzip/bench"]

[package]
name = "mvl"
version = "1.7.5"
edition = "2021"
description = "MVL — Maximum Verifiable Language compiler"
license = "Apache-2.0"

[features]
# Z3 backend is on by default. Requires Z3 installed.
# macOS homebrew: brew install z3  (paths set via .cargo/config.toml)
# To build without Z3: cargo build --no-default-features
default = ["z3", "openapi"]
z3 = ["dep:z3"]
# OpenAPI generation — walks AST surface, excluded from self-host build (#1336).
# To build without: cargo build --no-default-features [--features z3]
openapi = []

[dependencies]
ureq = "2"
tempfile = "3"
tar = "0.4"
flate2 = "1"
regex = "1"
z3 = { version = "0.12", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
# Assemble + type-validate emitted WAT inside `cargo test`. The WASM emitter's
# tests used to assert only on substrings of the generated text, which cannot
# see a module that assembles but fails validation — the failure mode behind
# several #2014 gaps (uninterned literal leaving the stack short, dangling
# `call`, undeclared local). `wasm-tools parse` in the corpus runner did not
# catch these either; `parse` is not `validate`.
wat = "1"
wasmparser = "0.221"

[[bench]]
name = "refinement_solver"
harness = false
