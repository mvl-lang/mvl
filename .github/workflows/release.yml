name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v0.10.2, v1.0.0
  workflow_dispatch:  # Allow manual trigger
    inputs:
      version:
        description: 'Version to build (e.g., 0.10.2)'
        required: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BINARY_NAME: mvl

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # v1.0.x ships aarch64-apple-darwin only. Other targets tracked in #1809.
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          key: ${{ matrix.target }}

      # --no-default-features drops Z3 + openapi. Z3 isn't installed on the
      # runner and .cargo/config.toml hardcodes a homebrew path; the openapi
      # feature isn't needed in the shipped binary. See #1808.
      - name: Build release binary
        run: cargo build --release --no-default-features --target ${{ matrix.target }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
            VERSION="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package binary
        shell: bash
        run: |
          ASSET="${BINARY_NAME}-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}" "${BINARY_NAME}"
          tar czf "${ASSET}" "${BINARY_NAME}"
          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: ${{ env.ASSET }}
          retention-days: 7

  package-stdlib:
    name: Package Stdlib
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package stdlib tarball
        run: |
          # Keyed on the compiler version so `mvl self install <ver>` can find
          # the artifact without prior knowledge of the stdlib version that
          # shipped with that release (matches how the runtime tarball is
          # looked up).
          ASSET="mvl-stdlib-${{ steps.version.outputs.version }}.tar.gz"
          # Layout inside the archive: `std/*.mvl` — extractor drops it under
          # `<mvl_data_home>/toolchains/{compiler_ver}/` so the final path is
          # `<mvl_data_home>/toolchains/{compiler_ver}/std/*.mvl`.
          tar czf "${ASSET}" std
          echo "STDLIB_ASSET=${ASSET}" >> "$GITHUB_ENV"

      - name: Upload stdlib artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mvl-stdlib-${{ steps.version.outputs.version }}
          path: ${{ env.STDLIB_ASSET }}
          retention-days: 7

  package-runtime:
    name: Package Runtime
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read runtime version
        id: runtime_version
        run: |
          VERSION=$(grep '^version' runtime/rust/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Package runtime tarball
        run: |
          ASSET="mvl-runtime-${{ steps.runtime_version.outputs.version }}.tar.gz"
          tar czf "${ASSET}" \
            --transform 's|^runtime/core|core|' \
            --transform 's|^runtime/rust-tokio|rust-tokio|' \
            --transform 's|^runtime/rust|rust|' \
            runtime/core \
            runtime/rust \
            runtime/rust-tokio
          echo "RUNTIME_ASSET=${ASSET}" >> "$GITHUB_ENV"
          echo "RUNTIME_VERSION=${{ steps.runtime_version.outputs.version }}" >> "$GITHUB_ENV"

      - name: Upload runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mvl-runtime-${{ steps.runtime_version.outputs.version }}
          path: ${{ env.RUNTIME_ASSET }}
          retention-days: 7

  container:
    name: Build and Push Container (${{ matrix.arch }})
    runs-on: ${{ matrix.runs_on }}
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, not QEMU — Rust + bindgen + Z3 under emulation is
          # too slow. ubuntu-24.04-arm is GA for public repos.
          - arch: amd64
            runs_on: ubuntu-latest
          - arch: arm64
            runs_on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          load: true
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: |
            MVL_VERSION=${{ steps.version.outputs.version }}
          tags: ghcr.io/mvl-lang/mvl:${{ steps.version.outputs.version }}-${{ matrix.arch }}

      - name: Smoke-test image (mvl prove exercises the Z3/L5 solver path)
        run: |
          docker run --rm -v "$PWD/examples/dose_scheduling:/work" \
            "ghcr.io/mvl-lang/mvl:${{ steps.version.outputs.version }}-${{ matrix.arch }}" \
            prove /work | tee prove.log
          grep -q "0 failed" prove.log

  container-manifest:
    name: Publish multi-arch container manifest
    runs-on: ubuntu-latest
    needs: [container]
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          docker buildx imagetools create \
            --tag "ghcr.io/mvl-lang/mvl:${VERSION}" \
            --tag ghcr.io/mvl-lang/mvl:latest \
            "ghcr.io/mvl-lang/mvl:${VERSION}-amd64" \
            "ghcr.io/mvl-lang/mvl:${VERSION}-arm64"

  release:
    name: Create GitHub Release
    needs: [build, package-runtime, package-stdlib]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release already exists (auto-created on tag push, or manual) — just attach assets.
            # --clobber lets re-runs overwrite previously-attached assets instead of failing.
            gh release upload "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --clobber \
              dist/*
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes \
              dist/*
          fi
